---
- name: Deploy app in new namespace
  hosts: localhost #Executing this locally in Ansible controller but it will connec to EKS cluster
  vars:
    ansible_python_interpreter: /home/dataeng/ansible-projects/k8s/.venv/bin/python 
  tasks: 
    - name: Create a k8s namespace
      kubernetes.core.k8s:
        name: my-app
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: kubeconfig_myapp-eks-cluster #uses the kubeconfig file to connect to the EKS cluster
    - name: Deploy nginx app
      kubernetes.core.k8s:
        src: nginx-config.yaml # Path to the Kubernetes manifest file for the nginx deployment
        state: present
        kubeconfig: kubeconfig_myapp-eks-cluster #uses the kubeconfig file to connect to the EKS cluster
        namespace: my-app