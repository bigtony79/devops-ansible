---
- name: Wait for SSH connection #Wait for EC2 server to be provisioned before Ansible executes remaining plays
  hosts: aws_ec2
  gather_facts: False
  tasks:
    - name: Ensure SSH port open
      wait_for:
        port: 22
        delay: 15
        timeout: 300
        search_regex: OpenSSH
        host: '{{ (ansible_ssh_host | default(ansible_host)) | default(inventory_hostname) }}'
      delegate_to: localhost
      vars:        
        ansible_python_interpreter: /usr/bin/python3

- name: Install Docker and Docker Compose
  hosts: aws_ec2
  become: yes    
  tasks:
    - name: Install Docker
      yum: 
        name: docker
        update_cache: yes # Update the package cache before installing
        state: present  
   
- name: Download and Install Docker Compose
  hosts: aws_ec2
  vars_files:
    - vars-file.yaml
  tasks:  
    - name: Create directory for docker-compose
      file:
        path: "{{docker_compose_dir}}"
        state: directory
    - name: Get architecture of remote host
      command: uname -m
      register: architecture    
    - name: Download docker-compose    
      get_url:
        url: "https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-{{architecture.stdout}}"
        dest: "{{docker_compose_dir}}/docker-compose"
        mode: '+x'
    - name: Verify docker-compose installation
      command: "{{docker_compose_dir}}/docker-compose --version"
      register: docker_compose_version
    - name: Display docker-compose version
      debug: 
        msg: "Docker Compose version installed: {{ docker_compose_version.stdout }}"


- name: Add ec2-user to docker group
  hosts: aws_ec2
  become: yes
  tasks:
    - name: Add ec2-user to docker group
      user: # user is a built-in Ansible module that allows you to manage users on the target
        name: ec2-user
        groups: docker
        append: yes # Append the user to the docker group without removing them from other groups
    - name: Reconnect to server session
      meta: reset_connection # meta is a built-in Ansible module that allows you to perform various meta-operations on the target hosts. It is used here to reset the connection to the server session, which is necessary for the group changes to take effect

- name: Start Docker service
  hosts: aws_ec2
  become: yes
  tasks:
    - name: Start Docker service
      service: # service is a built-in Ansible module that allows you to manage services on the target hosts. It is used here to start the Docker service and enable it to start on boot.
        name: docker
        state: started
        enabled: yes # Enable Docker service to start on boot

- name: Test docker pull
  hosts: aws_ec2
  tasks: 
    - name: Pull hello-world image
      docker_image: # docker_image is a built-in Ansible module that allows you to manage Docker images on the target hosts. It is used here to pull the hello-world image from Docker Hub.
        name: hello-world
        source: pull

- name: Start docker containers
  hosts: aws_ec2
  vars_files:
    - vars-file.yaml  
  tasks:
    - name: Copy docker compose file to remote host
      copy: # copy is a built-in Ansible module that allows you to copy files from the local machine to the target hosts. It is used here to copy the docker-compose.yaml file to the remote host.
        src: "{{location_source}}/docker-compose.yaml"
        dest: "{{location_target}}/docker-compose.yaml"
    - name: Docker login
      docker_login:
        username: "{{docker_username}}" # docker_username is a variable that should be defined in the vars-file.yaml file. It is used here to authenticate with Docker Hub before pulling the images.
        password: "{{docker_password}}" # docker_password is a variable that should be defined in the vars-file.yaml file. It is used here to authenticate with Docker Hub before pulling the images.
    - name: Start docker containers using docker-compose
      community.docker.docker_compose_v2: # docker_compose is a built-in Ansible module that allows you to manage Docker Compose applications on the target hosts. It is used here to start the containers defined in the docker-compose.yaml file.
        project_src: "{{location_target}}" # project_src is a parameter that specifies the directory containing the docker-compose.yaml file. It is used here to specify the location of the file on the remote host.
        state: present # state is a parameter that specifies the desired state of the application. It is used here to ensure that the containers are started and running.



 
 

     
     
     
     
            
   
   
   
   
   
   
   
   
   
  
  
  
  
  
  
  
    

      